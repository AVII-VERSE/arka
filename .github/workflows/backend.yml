name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - 'agent/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'agent/**'
      - '.github/workflows/backend.yml'

jobs:
  test-backend:
    name: Pytest & Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arka_user
          POSTGRES_PASSWORD: arka_password_change_me
          POSTGRES_DB: arka_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]" -e "./agent[dev]"

      - name: Run Pytest with Coverage
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: arka_user
          POSTGRES_PASSWORD: arka_password_change_me
          POSTGRES_DB: arka_test_db
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          pytest backend/tests agent/tests --cov=backend/app --cov-report=xml
