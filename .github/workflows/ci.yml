name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-checks:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]" -e "./agent[dev]"

      - name: Run Ruff Lint Check
        run: |
          ruff check backend/ agent/

      - name: Run MyPy Type Check
        run: |
          mypy backend/app agent/arka_agent

      - name: Run Pytest Test Suite
        run: |
          pytest backend/tests agent/tests

  frontend-checks:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: |
          cd frontend && npm install

      - name: Build Frontend Distribution
        run: |
          cd frontend && npm run build

  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]" -e "./agent[dev]"

      - name: Run Bandit Security Analysis
        run: |
          bandit -r backend/app agent/arka_agent -ll
