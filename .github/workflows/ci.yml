name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-checks:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/pyproject.toml ]; then pip install -e "backend/[dev]"; fi

      - name: Run Ruff Lint
        run: |
          pip install ruff mypy pytest
          if [ -d backend/app ]; then ruff check backend/; fi

      - name: Run MyPy Type Check
        run: |
          if [ -d backend/app ]; then mypy backend/app; fi

      - name: Run Backend Unit Tests
        run: |
          if [ -d backend/tests ]; then pytest backend/tests; fi

  frontend-checks:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f frontend/package.json ]; then cd frontend && npm ci; fi

      - name: Type Check & Lint
        run: |
          if [ -f frontend/package.json ]; then cd frontend && npm run build; fi

  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Bandit Security Analysis
        run: |
          pip install bandit
          if [ -d backend/app ]; then bandit -r backend/app -ll; fi
