name: Security Audit & Scans

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  security-audit:
    name: Code & Dependency Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]" -e "./agent[dev]"

      - name: Run Bandit (Static Application Security Testing)
        run: |
          bandit -r backend/app agent/arka_agent -ll

      - name: Run Pip-Audit (Dependency Vulnerability Scanner)
        run: |
          pip-audit --directory backend/
