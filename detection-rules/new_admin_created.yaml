id: rule-new-admin-created
rule_code: NEW_ADMIN_CREATED
name: New Local Administrator User Created
description: Detects creation of new local administrative account on server host.
severity: CRITICAL
enabled: true
tenant_id: default
mitre_attack:
  tactic: Persistence
  technique_id: T1136.001
  technique_name: Create Account: Local Account
conditions:
  event_type: authentication
  action: user_created
threshold:
  count: 1
  time_window_seconds: 60
  group_by:
    - host
