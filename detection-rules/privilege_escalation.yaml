id: rule-privilege-escalation
rule_code: PRIVILEGE_ESCALATION
name: Privileged Account Assignment
description: Detects user accounts being added to privileged local or domain administrator groups.
severity: CRITICAL
enabled: true
tenant_id: default
mitre_attack:
  tactic: Persistence
  technique_id: T1078
  technique_name: Valid Accounts
conditions:
  event_type: authentication
  action: group_member_added
threshold:
  count: 1
  time_window_seconds: 60
  group_by:
    - user
