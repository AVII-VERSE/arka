version: '3.8'

services:
  # ------------------------------------------------------------
  # PostgreSQL Database (Metadata, Users, Rules, Incidents)
  # ------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: arka-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arka_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arka_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-arka_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arka_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------
  # Redis Cache & Sliding Window State Store
  # ------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: arka-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------
  # Apache Kafka Event Streaming Bus (KRaft Mode)
  # ------------------------------------------------------------
  kafka:
    image: bitnami/kafka:3.7
    container_name: arka-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
    volumes:
      - kafka-data:/bitnami/kafka

  # ------------------------------------------------------------
  # OpenSearch Security Event Search & Indexing Engine
  # ------------------------------------------------------------
  opensearch:
    image: opensearchproject/opensearch:2.12.0
    container_name: arka-opensearch
    restart: unless-stopped
    environment:
      - cluster.name=arka-cluster
      - node.name=arka-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  # ------------------------------------------------------------
  # Keycloak OAuth 2.0 / OIDC Authentication Identity Provider
  # ------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: arka-keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-arka_db}
      KC_DB_USERNAME: ${POSTGRES_USER:-arka_user}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-arka_password_change_me}
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  opensearch-data:
